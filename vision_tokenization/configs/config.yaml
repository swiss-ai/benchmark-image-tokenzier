# ══════════════════════════════════════════════════════════════════════════════
#  Vision Tokenization Pipeline — Main Config
# ══════════════════════════════════════════════════════════════════════════════
#
#  Usage:
#    python -m vision_tokenization.tokenize \
#        mode=image2text dataset=pmc_oa num_gpus=4
#
#  Override any field from CLI:
#    ... dataset.max_batch_tokens=32_768 tokenizer.max_pixels="2048*2048"
#
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - dataset: image_only/llava85m_midtrain
  - _self_

# --- Pipeline -----------------------------------------------------------------

num_gpus: ???                      # total GPU count (verified against SLURM_NTASKS)
mode: ???                          # required: image_only | sft | image2text | text2image | interleave | alignment

# --- Tokenizer ----------------------------------------------------------------

tokenizer:
  path: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok
  # Resize band ALIGNED ACROSS PRETRAIN/SFT/ALIGNMENT (user decision
  # 2026-06-11): post-training never silently changes the vision front-end.
  # 1400^2 -> <=~7.7k tokens/image; recorded in alignment's manifest.json.
  min_pixels: "128*128"
  max_pixels: "1400*1400"
  max_encode_pixels: 8_000_000

# --- Checkpointing & Resume --------------------------------------------------

resume: false
merge_shards: false
rebuild: true
dry_run: false

# --- Weights & Biases --------------------------------------------------------

wandb:
  enabled: true
  log_interval_seconds: 1
  project: vision-tokenization
  entity: null
  name: null
  group: null   # nest related runs (e.g. sharded alignment: one group, N shard runs)
  tags: []
