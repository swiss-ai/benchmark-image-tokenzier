# ══════════════════════════════════════════════════════════════════════════════
#  Vision Tokenization Pipeline — Main Config
# ══════════════════════════════════════════════════════════════════════════════
#
#  Usage:
#    python -m vision_tokenization.tokenize \
#        mode=image2text dataset=pmc_oa num_gpus=4
#
#  Override any field from CLI:
#    ... dataset.max_batch_tokens=32_768 tokenizer.max_pixels="2048*2048"
#
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - dataset: image_only/llava85m_midtrain
  - _self_

# --- Pipeline -----------------------------------------------------------------

num_gpus: ???                      # total GPU count (verified against SLURM_NTASKS)
mode: ???                          # required: image_only | sft | image2text | text2image | interleave

# --- Tokenizer ----------------------------------------------------------------

tokenizer:
  path: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok
  min_pixels: "128*128"
  max_pixels: "1400*1400"
  max_encode_pixels: 8_000_000

# --- Checkpointing & Resume --------------------------------------------------

resume: false
merge_shards: false
rebuild: true
dry_run: false

# Opt-in: write per-sequence source-manifest-row sidecars (rank_XXXX_chunk_YYYY.src.npy)
# so tokenized output positions can be mapped back to source dataset rows. Default off →
# byte-identical output and no extra files. Must be enabled from the start of a run.
emit_provenance: false

# --- Weights & Biases --------------------------------------------------------

wandb:
  enabled: true
  log_interval_seconds: 1
  project: vision-tokenization
  entity: null
  name: null
  tags: []
