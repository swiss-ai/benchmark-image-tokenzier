# Task fragment for posttraining-mode datasets (composed via defaults; the
# file keeps the internal `alignment` name).
# The mode is task-neutral; `task` selects the row adapter + view schema in
# ingest.py (ROW_ADAPTERS). `preference` today; `rl_prompt` reserved for P4.
task: preference

tokenizer_path: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct_thinking_token_fixed
# No dataset min/max_pixels here: build_plan_posttraining ignores the pixel
# filter (the scan is the only gate); the recorded resize band is the
# tokenizer's (config.yaml tokenizer.min_pixels/max_pixels).
# Exact-dim GPU batches (the unified executor's batch_size); the tokenizer's
# max_encode_pixels chunks within a batch to bound peak GPU memory.
batch_size: 32
val_rows: 256
