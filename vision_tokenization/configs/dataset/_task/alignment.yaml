# never silently changes the vision front-end. 1400^2 -> <=~7.7k tokens/image;
# multimodal DPO runs use max_total_sequence_length 16384. Recorded in manifest.json.
min_pixels: "128*128"
max_pixels: "1400*1400"
encode_batch_size: 32
val_rows: 256
