# The mode is task-neutral; `task` selects the row adapter + view schema in
# ingest.py (ROW_ADAPTERS). `preference` today; `rl_prompt` reserved for P4.
task: preference

tokenizer_path: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct_thinking_token_fixed
