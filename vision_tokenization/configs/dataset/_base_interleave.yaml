# ──────────────────────────────────────────────────────────────────────────────
# Base defaults for interleaved datasets (JSONL+tar or WDS with segment parsing)
# ──────────────────────────────────────────────────────────────────────────────

dataset_type: jsonl_tar_interleave

output_dir: ???
manifest_path: ???
multi_image: true

min_pixels: "64*128"
max_pixels: "2048*2048"

# Document parsing
parser: ???
document_format: null
document_field: null
local_image_prefixes:
  - content_image/
  - image/
max_sequence_tokens: 262_144

# Plan
plan_path: null
window_size: 5000

# Batch planning
max_batch_tokens: 32_768
batch_size: 128
spatial_factor: 16

# Prefetch
prefetch:
  queue_size: 16
  num_workers: 8

# Checkpoint
checkpoint_interval_batches: 2_500

max_consecutive_errors: 50
seqlen_threshold: 8192
max_open_files: 64
