# ──────────────────────────────────────────────────────────────────────────────
# Base defaults for HuggingFace Arrow/Parquet datasets
# ──────────────────────────────────────────────────────────────────────────────

dataset_type: hf

output_dir: ???
manifest_path: ???
input_pattern: ???
image_column: image
multi_image: null
parser: null

min_pixels: "64*128"
max_pixels: "2048*2048"

# Plan
plan_path: null
window_size: 2000

# Batch planning
max_batch_tokens: 32_768
batch_size: 128
spatial_factor: 16

# Prefetch
prefetch:
  queue_size: 32
  num_workers: 8

# Checkpoint
checkpoint_interval_batches: 2_500

max_consecutive_errors: 50
max_cached_chunks: 128
seqlen_threshold: null
