# ──────────────────────────────────────────────────────────────────────────────
# MMPR-v1.2 (OpenGVLab) — posttraining/preference, parquet (image bytes embedded),
# single- & multi-image. InternVL's Multimodal Preference dataset; the training
# data MPO (arXiv:2411.10442) was built for. -> views+media preference stores.
#
# Provenance:
#   raw:       vision-datasets/raw/preference/hf___OpenGVLab___MMPR-v1.2 (51 GB,
#              annotations.zip [148 jsonl] + images.zip_a{a,b,c} [266,908 imgs])
#   converter: multimodal-data/01-dataset-download/image/mmpr/convert_mmpr_v1_2.py
#              (zip-direct join, <image> injection, audit drops, 8 hash-shards)
#   shards:    vision-datasets/alignment-processed/mmpr-v1.2/part_{00..07}.parquet
#              (hash-of-first-image -> image reuse colocates within a store;
#               ~101-103k rows & ~20-22 GB each, ~171 GB total)
#
# Converter audit (815,293 seen -> 813,427 kept, 99.77%):
#   drops: 14 missing-image, 12 marker-in-response, 33 empty, 1,396 identical,
#          411 self-commentary-in-chosen
#   flags: 288,239 zero-marker prompts <image>-prepended, 72,489 multi-image,
#          32,227 <think>-in-chosen (kept; per-pair deliberation set at train
#          time, keyed on chosen), 539 self-commentary-in-rejected (kept = signal)
#   dry-run (1400^2 resize band): ~260k unique imgs, 793,211,943 image tokens
#
# Scope: tokenized shard-by-shard (posttraining is single-rank per STORE; the
# in-job ingest loads the whole parquet into RAM). The launcher packs the 8
# shards onto 2 nodes / 8 GPUs (see scripts/slurm/tokenize/posttraining/
# mmpr_v1_2.slurm) and pins input_parquet + output_name per shard from
# `source_dir` below. Output root: <output_dir>/preference/<output_name>.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_task/alignment@_here_

# Data location (single source of truth; per-shard paths derive from it below):
source_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/alignment-processed/mmpr-v1.2
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized

# --- Per-shard selection ------------------------------------------------------
# One config, 8 shards: the launcher passes the zero-padded shard id
# (`dataset.shard=00..07`) and input_parquet/output_name derive from it by
# interpolation — no hardcoded paths, no bash path-building, no magic padding
# in the path. manifest.json:source_input records the resolved input per store.
shard: ???
input_parquet: ${.source_dir}/part_${.shard}.parquet
output_name: mmpr_v1_2_part${.shard}
