# ──────────────────────────────────────────────────────────────────────────────
# OWID Data Insights — interleave, JSONL + tar
# Short human-authored data-journalism pieces (416 docs), each with one chart
# embedded as ``![<image_alt>](<slug>.png)`` between body text and a detailed
# chart description. CC BY 4.0.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/jsonl_tar@_here_
  - /dataset/_task/interleave@_here_

output_name: owid_data_insights
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/cooldown
input_pattern: "/capstor/store/cscs/swissai/infra01/vision-datasets/processed/owid___charts/data_insights_jsonl_tar/owid_data_insights.jsonl"
manifest_path: ${manifest_root}/owid_data_insights/manifest.parquet
tar_pattern: "owid_data_insights-*.tar"
parser: pin200m
document_field: md

# Images are up to ~5M px; don't drop any.
max_pixels: "65536*65536"
max_batch_tokens: 32_768
