# ──────────────────────────────────────────────────────────────────────────────
# HQ-50K (YangQiee/HQ-50K) — image2text, high-quality image captions.
# 36,806 full-resolution photos (median 1855×1646 px) paired with
# DOCCI-style dense captions generated by an internal VLM with the
# ``hq50k_caption_docci10_fewshot_v8`` prompt. Captions are detailed,
# grounded, and cover diverse domains (photography, illustration,
# comics, posters, newsprint). Raw HQ-50K.zip upstream is images only;
# captions were generated locally.
# Preprocessing: flattened from SFT-style ``images: List[Binary]`` +
# ``messages: List[Struct]`` to three scalar columns
# (``sample_id``, ``image_bytes``, ``caption``) via pyarrow for
# tokenization efficiency.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/hf@_here_
  - /dataset/_task/image2text@_here_

output_name: hq50k
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/cooldown
input_pattern: "/capstor/scratch/cscs/xyixuan/vision-datasets-processed/hq50k_v7_flat/*.parquet"
manifest_path: ${manifest_root}/hq50k/manifest.parquet
image_column: image_bytes
text_column: caption

# 60% of source images exceed 1400×1400 — don't filter at the dataset level;
# the tokenizer's ``max_pixels: 1400*1400`` handles downscale.
max_pixels: "65536*65536"
max_batch_tokens: 32_768

# Captions are short (median ~180 tokens); image tokens dominate at
# ~6K per sample after downscale. Virtually no sample exceeds 8K, but
# keep the split for cooldown-layout consistency with docci and
# owid_grapher_charts.
