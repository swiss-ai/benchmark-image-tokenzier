# ──────────────────────────────────────────────────────────────────────────────
# OWID Grapher Charts (standalone) — image2text, HF parquet.
# 3,487 OWID chart PNGs that do NOT appear in any OWID article or data-insight
# (filtered out of the raw 4,486 so we don't duplicate the caption signal that
# articles already provide in their body+alt text).
# Captions generated by Qwen/Qwen3.5-397B-A17B-xyixuan with prompt_tag metadata;
# merged image+caption parquet built by joining the image and caption files on
# ``slug``. Zero captioning failures; all 3,487 rows have non-empty captions.
# CC BY 4.0.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/hf@_here_
  - /dataset/_task/image2text@_here_

output_name: owid_grapher_charts
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/cooldown
input_pattern: "/capstor/store/cscs/swissai/infra01/vision-datasets/processed/owid___charts/grapher_charts_captioned_merged.parquet"
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/owid_grapher_charts/manifest.parquet
image_column: image_bytes
text_column: caption

# Grapher PNGs are ~60 KB each (avg), far below 1400×1400 — no filtering needed.
max_pixels: "65536*65536"
max_batch_tokens: 32_768

# Split output into stage2/ (≤ threshold) and lct/ (> threshold) for layout
# consistency with the other cooldown datasets. Captions run long (avg ~1,400
# chars / ~350 tokens) so a meaningful fraction will end up in lct/.
seqlen_threshold: 8192
