# ──────────────────────────────────────────────────────────────────────────────
# cyberagent/crello — image2text, Qwen-augmented BLIP3-Grounding-style.
#
# 23,104 graphic-design templates (Instagram/Twitter/Facebook ads, posters,
# flyers, presentation slides) under CDLA-Permissive-2.0.  Each row is a
# rendered preview JPEG paired with a richly-detailed grounded description
# generated by Qwen3.6-27B with ground-truth designer-authored bounding
# boxes embedded inline (BLIP3-Grounding Level-2 format):
#
#     This vertical Instagram story advertises a workshop on... The design
#     is centred, using a palette of teal, coral, and cream. ...
#     The design contains <object>bold sans-serif headline "WORKSHOP"</object>
#     <bbox>[0.060, 0.096][0.448, 0.142]</bbox>, <object>illustration of a
#     person typing on a laptop</object><bbox>[0.060, 0.223][0.765, 0.798]</bbox>,
#     ...
#
# Coordinates are 100% ground-truth (Crello's structured `left/top/width/height`
# per element, normalised to 0.0-1.0 of canvas dims) — gt-match rate 99.99%
# verified across all 23K rows.  Captions: median 1,755 chars, ~8 grounded
# objects per design.  See:
#   /capstor/scratch/cscs/xyixuan/recon/qwen_crello_grounded/
#
# Schema (per row):
#   id              : design id
#   title           : original Crello template title
#   canvas_width    : int
#   canvas_height   : int
#   n_elements      : int (raw GT element count, pre-coverage filter)
#   image           : preview JPEG bytes  ← image_column
#   grounded_text   : BLIP3-style description  ← text_column
#   gc_elapsed_s, gc_n_objects, gc_n_gt_match, gc_endpoint : metadata
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/hf@_here_
  - /dataset/_task/image2text@_here_

output_name: crello
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/cooldown
input_pattern: "/capstor/scratch/cscs/xyixuan/recon/qwen_crello_grounded/*.parquet"
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/crello/manifest.parquet

image_column: image
text_column: grounded_text

# Crello previews are rendered JPEGs at typical canvas sizes (1080×1080,
# 1920×1080, 1080×1920, etc.) — well within the default 2048×2048 cap.
# No need to widen max_pixels.
max_batch_tokens: 32_768

# Captions are ~1.7 K chars (~600 text tokens) + image tokens (~4-6 K) =
# ~6-7 K total per row — everything lands in the 8k band at merge time.
