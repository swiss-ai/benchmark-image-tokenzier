# ──────────────────────────────────────────────────────────────────────────────
# LLaVA-OneVision 85M mid-training paired — image2text, HuggingFace
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - _base_hf

output_name: llava85m_midtrain_paired
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/raw/mvp-lab__LLaVA-OneVision-1.5-Mid-Training-85M
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/llava_onevision_mid_85m/manifest.parquet
text_column: caption
multi_image: false

# --- Overrides ----------------------------------------------------------------
gpu_kmeans: false
batch_plan_path: /capstor/scratch/cscs/xyixuan/batch_plans/llava_onevision_mid_85m.pt
max_batch_tokens: 32_768
checkpoint_interval_batches: 5_000
