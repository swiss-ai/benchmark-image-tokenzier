# ──────────────────────────────────────────────────────────────────────────────
# PMC-OA — image2text, WebDataset, single-image + caption
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - _base_wds

output_name: pmc_oa_v2
output_dir: /capstor/scratch/cscs/xyixuan/vision-datasets-tokenized
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/pmc_oa/manifest.parquet
text_column: txt

# --- Single-image: each sample has img1.png ----------------------------------
multi_image: false
image_field_pattern: img

# --- Overrides ----------------------------------------------------------------
gpu_kmeans: false                  # faiss-gpu has no Python 3.12 wheels
batch_plan: /capstor/scratch/cscs/xyixuan/batch_plans/pmc_oa.pt
checkpoint_interval_batches: 5_000

prefetch:
  queue_size: 8
  num_workers: 4
