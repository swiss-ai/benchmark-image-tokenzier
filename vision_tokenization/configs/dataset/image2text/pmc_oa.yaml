# ──────────────────────────────────────────────────────────────────────────────
# PMC-OA — image2text, WebDataset, single-image + caption
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/wds@_here_
  - /dataset/_task/image2text@_here_

output_name: pmc_oa
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/raw/stage2/hf___axiong___pmc_oa___cleaned/part-*.tar
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/pmc_oa/manifest.parquet
text_column: txt

# --- Single-image: each sample has img1.png ----------------------------------
multi_image: false
image_field_pattern: img

# Stage2/lct split + safety cap (matches other stage2 retokenized datasets)
max_sequence_tokens: 262_144

# --- Overrides ----------------------------------------------------------------
gpu_kmeans: false                  # faiss-gpu has no Python 3.12 wheels
plan_path: /capstor/scratch/cscs/xyixuan/batch_plans/pmc_oa.pt
checkpoint_interval_batches: 5_000

prefetch:
  queue_size: 8
  num_workers: 4
