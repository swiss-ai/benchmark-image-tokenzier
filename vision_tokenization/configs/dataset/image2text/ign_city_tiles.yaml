# ──────────────────────────────────────────────────────────────────────────────
# IGN City Tiles — image2text, WDS tar, single-image + txt sidecar (~14K rows)
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/wds@_here_
  - /dataset/_task/image2text@_here_

output_name: ign_city_tiles
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/ign___ign_city_tiles___processed___cleaned/part-*.tar
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/ign_city_tiles/manifest.parquet
text_column: txt

multi_image: false
image_field_pattern: img

# Stage2/lct split + safety cap (matches innovator/nemotron convention)
seqlen_threshold: 8_192
max_sequence_tokens: 262_144

plan_path: /capstor/scratch/cscs/xyixuan/batch_plans/ign_city_tiles.pt
max_batch_tokens: 32_768
