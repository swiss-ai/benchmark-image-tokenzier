# ──────────────────────────────────────────────────────────────────────────────
# WebSight v0.2 — image2text, HF Parquet, single-image (screenshot + HTML)
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - _base_hf

output_name: websight
output_dir: /capstor/scratch/cscs/xyixuan/vision-datasets-tokenized
manifest_path: /capstor/store/cscs/swissai/infra01/vision-datasets/HuggingFaceM4___WebSight/v0.2_normalized/manifest.parquet
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/HuggingFaceM4___WebSight/v0.2_normalized/*.parquet
