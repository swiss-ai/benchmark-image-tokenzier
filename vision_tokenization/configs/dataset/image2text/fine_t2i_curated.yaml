# ──────────────────────────────────────────────────────────────────────────────
# Fine-T2I Curated — image2text, WDS tar, enhanced prompts from JSON sidecar
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/wds@_here_
  - /dataset/_task/image2text@_here_

output_name: fine_t2i_curated
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
manifest_path: ${manifest_root}/fine_t2i_curated/manifest.parquet
text_column: enhanced_prompt

max_pixels: "16384*16384"
max_batch_tokens: 32_768

prefetch:
  num_workers: 16
  queue_size: 8
