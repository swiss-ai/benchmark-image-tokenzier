# ──────────────────────────────────────────────────────────────────────────────
# Base defaults for SFT datasets
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - _base_hf

# SFT needs the instruct tokenizer (has chat_template for apply_chat_template).
tokenizer_path: /capstor/store/cscs/swissai/infra01/MLLM/tokenizer/apertus_emu3.5_wavtok_instruct

text_column: null

# Optional raw-row parser for datasets that are not already stored as
# conversation lists.
#
# Recommended patterns:
#
# 1. Dataset already stores chat turns
#    text_column: conversations
#    parser: null
#
# 2. Flat single-image QA rows
#    parser: qa
#    parser_columns: [question, answer]
#
# 3. Multi-image Molmo QA rows
#    parser: molmo_multi_image_qa
#    parser_columns: [qa_pairs]
#
# 4. Conversation rows under a non-standard column
#    parser: conversation
#    parser_columns: [dialog]
#    parser_args:
#      conversation_column: dialog
#
# Keep parser_columns explicit in YAML so the loader reads only the required
# raw columns and the config makes the data dependency obvious.
parser: null
parser_columns: null
parser_args: {}

# Lightweight normalization after the raw row has been converted into
# conversation messages.
conversation_policy: {}
