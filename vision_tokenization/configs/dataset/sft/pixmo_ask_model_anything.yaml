# ──────────────────────────────────────────────────────────────────────────────
# Pixmo-Ask-Model-Anything (AllenAI) — SFT, single-image Q/A (≈60K rows).
# Images stored as raw JPEG bytes in the ``jpg`` column.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/hf@_here_
  - /dataset/_task/sft@_here_

output_name: pixmo_ask_model_anything
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: "/capstor/store/cscs/swissai/infra01/vision-datasets/raw/sft/hf___allenai___pixmo-ask-model-anything/preprocessed/0*.parquet"
manifest_path: ${manifest_root}/pixmo_ask_model_anything/manifest.parquet
image_column: jpg

# Preprocessed parquet stores the Q/A pair as a two-element ``messages``
# list of ``{role, content}`` dicts (canonical chat format), so we use the
# ``conversation`` parser which passes it straight through. The original
# user turn has no ``<image>`` marker, so the conversation policy
# auto-prepends one to the first user message.
parser: conversation
parser_columns:
  - messages

conversation_policy:
  add_image_placeholder: true

# Pixmo source images can reach multi-megapixel sizes; don't filter.
max_pixels: "65536*65536"
max_batch_tokens: 32_768
