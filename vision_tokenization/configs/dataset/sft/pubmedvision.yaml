# ──────────────────────────────────────────────────────────────────────────────
# PubMedVision (FreedomIntelligence) — Apache-2.0 medical VQA, the priority medical add.
#   InstructionTuning_VQA (646,759) + Alignment_VQA (646,759) = 1,293,518 rows / ~914K PMC images.
# GPT-4V REFORMATS expert PubMed figure captions (not diagnosis) → proven medical-benchmark lift
# (HuatuoGPT-Vision). Multi-image (1–29 imgs/row); N <image> placeholders injected per row during
# prep (source has none). Images repacked from 20 zips → 20 tars (members images/pmc_X.jpg == jsonl
# image refs, no prefix strip). Prep: multimodal-data/01-dataset-download/pubmedvision_prep.py
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/jsonl_tar@_here_
  - /dataset/_task/sft@_here_

output_name: pubmedvision
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/pubmedvision/pubmedvision.jsonl
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/pubmedvision/manifest.parquet

image_field: image
text_column: conversations
tar_pattern: "*.tar"
tar_scope: global
tar_root: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/pubmedvision/tars
image_path_prefix_strip: null
multi_image: true
seqlen_threshold: 16_384   # 16k (not 8k): PubMedVision is multi-image (up to 29), 8k would drop many multi-image rows

# Tokenize WITH the Omni default block (no override) → 80/20-strip later at placement,
# same flexible pattern as gmai_vl_permissive. (N <image> placeholders already in the jsonl,
# so no add_image_placeholder needed.)
