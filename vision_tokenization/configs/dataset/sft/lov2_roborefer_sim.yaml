# ──────────────────────────────────────────────────────────────────────────────
# LLaVA-OneVision-2 — roborefer_sim (Blender synthetic 2D-pointing), Apache-2.0.
# 245,926 ShareGPT rows, single-image, multi-turn coordinate pointing (no CoT).
# 53,174 images (uniform 960x540, ~0.5 MP) in 3 plain tars; ~4.62 rows/image.
# All sequences fit <8k (max 20 turns, ~3.4k worst-case tokens) -> stage2 only.
# System prompt disabled (empty block) to match osd.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/jsonl_tar@_here_
  - /dataset/_task/sft@_here_

output_name: lov2_roborefer_sim
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/hf___mvp-lab___LLaVA-OneVision-2-Data___roborefer_sim/roborefer_sim.jsonl
manifest_path: ${manifest_root}/lov2_roborefer_sim/manifest.parquet

image_field: image
text_column: conversations
tar_pattern: "*.tar"
tar_scope: global
tar_root: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/hf___mvp-lab___LLaVA-OneVision-2-Data___roborefer_sim
multi_image: true

conversation_policy:
  add_system_message: true
