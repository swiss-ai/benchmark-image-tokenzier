# ──────────────────────────────────────────────────────────────────────────────
# PangeaInstruct — multilingual VQA + QA SFT (39 languages, ShareGPT shape).
#
# Source: neulab/PangeaInstruct (Apache-2.0), 6.4M train-only records after
# normalization (see processed/sft/pangea_instruct/{PangeaIns_train_normalized.jsonl,
# subset_strip_map.json, dropped.jsonl}). Image archives unified under
# processed/sft/pangea_instruct/tars/, mirroring upstream subset hierarchy
# (caption/, cultural/, doc+chart/, general/, ocr/, LLaVA-Pretrain/).
#
# image field is a list[str] (multi-image SFT). Conversations use ShareGPT
# {from, value} — the conversation parser auto-detects.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/jsonl_tar@_here_
  - /dataset/_task/sft@_here_

output_name: pangea_instruct
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/pangea_instruct/PangeaIns_train_decontaminated.jsonl
manifest_path: ${manifest_root}/pangea_instruct/manifest.parquet

image_field: image
text_column: conversations

# All 47 tars (12 reassembled + 35 symlinked originals) live under a single
# global root mirroring upstream subset hierarchy.
tar_pattern: "**/*.tar*"
tar_scope: global
tar_root: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/pangea_instruct/tars

# Multi-image SFT: image refs are list[str] (1-4 images typical).
multi_image: true

# Stage 2 / lct split + safety cap.
max_sequence_tokens: 262_144
max_batch_tokens: 32_768

plan_path: /capstor/scratch/cscs/xyixuan/batch_plans/pangea_instruct.pt
