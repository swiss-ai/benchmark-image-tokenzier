# ──────────────────────────────────────────────────────────────────────────────
# mllm-dpo (prompt-in-pair) — ACCEPTED conversations. SFT, single image, HF parquet.
# 5,182 rows; each row has one image + an `accepted` and a `rejected` 2-turn
# conversation that share the same user prompt (with an inline <image> marker).
# Tokenize this and the sibling `_rejected` config against the SAME manifest so
# both runs share an identical plan; provenance then maps each output back to its
# source row for DPO pairing.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/hf@_here_
  - /dataset/_task/sft@_here_

output_name: mllm_dpo_accepted
output_dir: /iopsstor/scratch/cscs/rkreft/mllm-dpo/tokenized   # shards -> .../tokenized/sft/mllm_dpo_accepted
input_pattern: "/iopsstor/scratch/cscs/rkreft/mllm-dpo/mllm-dpo-prompt-in-pair.parquet"
manifest_path: /iopsstor/scratch/cscs/rkreft/mllm-dpo/manifest/manifest.parquet
image_column: image

# `accepted` is canonical list[{role, content}] chat; the conversation parser
# passes it through unchanged. conversation_column tells the parser which column
# holds the messages (the column name is not auto-detected).
parser: conversation
parser_columns:
  - accepted
parser_args:
  conversation_column: accepted

conversation_policy:
  add_image_placeholder: false   # <image> already present in the user turn
  add_system_message: true       # mirrors llava_onevision_sft; identical for both variants
