# ──────────────────────────────────────────────────────────────────────────────
# RadImageNet-VQA Instruct — SFT, single-image multi-turn QA (750K train rows)
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - _base_sft

output_name: radimgnet_vqa
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized/sft
input_pattern: "/capstor/store/cscs/swissai/infra01/vision-datasets/raw/sft/hf___raidium___RadImageNet-VQA/instruct/train-*.parquet"
manifest_path: /capstor/scratch/cscs/xyixuan/manifests/radimgnet_vqa/manifest.parquet
image_column: image
text_column: conversations

# Conversations use "template" as the assistant role name.
conversation_policy:
  role_map:
    human: user
    template: assistant
    gpt: assistant
    system: system
