# ──────────────────────────────────────────────────────────────────────────────
# LLaVA-OneVision-2 — osd (OpenImages 2D spatial-referring), Apache-2.0.
# 780,942 ShareGPT rows, single-image, multi-turn spatial MCQ (no CoT).
# 263,313 images (~0.5 MP) in 16 plain tars; ~2.97 rows/image. JSONL + tar (WDS).
# All sequences fit <8k (max 24 turns, ~3.6k worst-case tokens) -> stage2 only.
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  - /dataset/_pipeline@_here_
  - /dataset/_storage/jsonl_tar@_here_
  - /dataset/_task/sft@_here_

output_name: lov2_osd
output_dir: /capstor/store/cscs/swissai/infra01/vision-datasets/tokenized
input_pattern: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/hf___mvp-lab___LLaVA-OneVision-2-Data___osd/osd.jsonl
manifest_path: ${manifest_root}/lov2_osd/manifest.parquet

image_field: image
text_column: conversations
tar_pattern: "*.tar"
tar_scope: global
tar_root: /capstor/store/cscs/swissai/infra01/vision-datasets/processed/sft/hf___mvp-lab___LLaVA-OneVision-2-Data___osd
multi_image: true

# Disable the default "You are Apertus 1.5 Omni..." system prompt: insert an
# empty system message so the chat template renders an empty
# <|system_start|><|system_end|> block instead of the 45-token default.
#
# add_image_placeholder: the osd_reasoning_* subset (63,984 rows / 8.19%) has an
# image in the `image` field but no <image> placeholder in the conversation
# text, so without this they'd be silently dropped at render time. This prepends
# <image> to the first user turn only when absent (no-op for the 717k rows that
# already start with <image>; verified 0 rows would double-add).
conversation_policy:
  add_system_message: true
  add_image_placeholder: true
