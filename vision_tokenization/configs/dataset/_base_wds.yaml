# ──────────────────────────────────────────────────────────────────────────────
# Base defaults for WebDataset (.tar) datasets
# ──────────────────────────────────────────────────────────────────────────────

dataset_type: wds

output_dir: ???
manifest_path: ???
image_column: image
multi_image: null
parser: null

min_pixels: "64*128"
max_pixels: "2048*2048"

# Plan
plan_path: null
window_size: 5000

# Batch planning
max_batch_tokens: 32_768
batch_size: 128
spatial_factor: 16

# Prefetch
prefetch:
  queue_size: 64
  num_workers: 32

# Checkpoint
checkpoint_interval_batches: 2_500

augmentation: null
max_consecutive_errors: 50
seqlen_threshold: null

# WDS-specific
max_open_files: 64
